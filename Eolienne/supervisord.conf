; Supervision des services de la simulation.
; supervisord relance automatiquement tout service qui s'arrête.
; État des services : docker exec <conteneur> supervisorctl status

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
childlogdir=/tmp

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; --- Services -----------------------------------------------

; Serveur web / IHM (apache logue dans /var/log/apache2/)
[program:apache2]
command=/usr/sbin/apachectl -DFOREGROUND
priority=10
autorestart=true

; Simulateur de vent (écrit /tmp/wind.txt)
[program:wind]
command=python3 /data/process/wind.py
priority=10
autorestart=true
redirect_stderr=true
stdout_logfile=/tmp/wind.log

; Serveur Modbus de l'éolienne
[program:eolienne_server]
command=python3 /data/process/eolienne_server.py
priority=20
autorestart=true
redirect_stderr=true
stdout_logfile=/tmp/eolienne_server.log

; Automate S7comm (serveur + simulation physique de l'ascenseur)
[program:ascenseur_server]
command=python3 /data/process/ascenseur_server.py
priority=20
autorestart=true
redirect_stderr=true
stdout_logfile=/tmp/ascenseur_server.log

; --- Processus métier (démarrent après les serveurs) ---

; Contrôleur de l'éolienne
[program:eolienne_process]
command=python3 /data/process/eolienne_process.py
priority=30
autorestart=true
redirect_stderr=true
stdout_logfile=/tmp/eolienne_process.log

; Interlock éolienne / ascenseur
[program:ascenseur_process]
command=python3 /data/process/ascenseur_process.py
priority=30
autorestart=true
redirect_stderr=true
stdout_logfile=/tmp/ascenseur_process.log

; API REST ascenseur
[program:ascenseur_api]
command=python3 /data/process/ascenseur_api.py
priority=30
autorestart=true
redirect_stderr=true
stdout_logfile=/tmp/ascenseur_api.log
