; Supervision des services de la simulation.
; supervisord relance automatiquement tout service qui s'arrête.
; État des services : docker exec <conteneur> supervisorctl status

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
childlogdir=/tmp

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; --- Services -----------------------------------------------

; Serveur web / IHM (apache logue dans /var/log/apache2/)
;
; Le rm au démarrage est indispensable : si le conteneur a été arrêté
; brutalement (reboot de l'hôte, docker stop trop long), apache ne peut
; pas supprimer /run/apache2/apache2.pid. Au démarrage suivant, si ce
; pid obsolète a été réattribué à un autre process, apachectl croit que
; le serveur tourne déjà ("httpd (pid N) already running", exit 0) et
; supervisord passe apache2 en FATAL ("Exited too quickly").
[program:apache2]
command=/bin/sh -c "rm -f /run/apache2/*.pid; exec /usr/sbin/apachectl -DFOREGROUND"
priority=10
autorestart=true

; Simulateur de vent (écrit /tmp/wind.txt)
[program:wind]
command=python3 /data/process/wind.py
priority=10
autorestart=true
redirect_stderr=true
stdout_logfile=/tmp/wind.log

